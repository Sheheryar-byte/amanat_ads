name: Deploy to Azure VMSS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AZURE_RESOURCE_GROUP: 'rg-amanat-ads'
  AZURE_VMSS_NAME: 'vmss-amanat-ads'
  APP_RUN_DIR: '/opt/amanat_ads_run'
  STORAGE_CONTAINER: 'deployments'

jobs:
  # ── JOB 1: Build in GitHub Actions (fast, no VM load) ────────────────────────
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production bundle (standalone)
        run: npm run build

      - name: Verify build output
        run: |
          test -d .next/standalone && echo "✓ Standalone output found"
          test -f src/app/ms39/page.tsx && echo "✓ /ms39 route found"

      - name: Package standalone bundle into tarball
        run: |
          mkdir -p _bundle
          cp -r .next/standalone/. _bundle/
          cp -r .next/static       _bundle/.next/static
          cp -r public             _bundle/public
          tar -czf bundle.tar.gz -C _bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-bundle
          path: bundle.tar.gz
          retention-days: 1

  # ── JOB 2: Upload bundle to Azure Blob, deploy via short URL ─────────────────
  deploy:
    name: Deploy to VMSS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: standalone-bundle

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Upload bundle to Azure Blob Storage and get a SAS download URL ─────
      - name: Upload bundle to Azure Blob Storage
        id: upload
        run: |
          # Find existing storage account in resource group, or create one
          SA=$(az storage account list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[0].name" --output tsv 2>/dev/null || true)

          if [ -z "$SA" ]; then
            # Storage account names must be 3-24 chars, lowercase alphanumeric only
            SA="stgamanat$(date +%s | tail -c 6)"
            echo "Creating storage account: $SA"
            az storage account create \
              --name "$SA" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --sku Standard_LRS \
              --kind StorageV2
          else
            echo "Using existing storage account: $SA"
          fi

          # Get account key for operations
          KEY=$(az storage account keys list \
            --account-name "$SA" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[0].value" --output tsv)

          # Create container (idempotent — won't fail if already exists)
          az storage container create \
            --name "${{ env.STORAGE_CONTAINER }}" \
            --account-name "$SA" \
            --account-key "$KEY" \
            --output none

          # Upload the tarball
          BLOB_NAME="bundle-${{ github.sha }}.tar.gz"
          az storage blob upload \
            --account-name "$SA" \
            --account-key "$KEY" \
            --container-name "${{ env.STORAGE_CONTAINER }}" \
            --name "$BLOB_NAME" \
            --file bundle.tar.gz \
            --overwrite \
            --output none

          echo "Uploaded: $BLOB_NAME"

          # Generate SAS URL valid for 2 hours — VM will curl this
          EXPIRY=$(date -u -d "+2 hours" "+%Y-%m-%dT%H:%MZ")
          SAS_URL=$(az storage blob generate-sas \
            --account-name "$SA" \
            --account-key "$KEY" \
            --container-name "${{ env.STORAGE_CONTAINER }}" \
            --name "$BLOB_NAME" \
            --permissions r \
            --expiry "$EXPIRY" \
            --full-uri \
            --output tsv)

          # Base64-encode the URL so it's safe to pass as a run-command parameter
          # (SAS URLs contain & and = which can cause shell parsing issues)
          SAS_URL_B64=$(echo -n "$SAS_URL" | base64 -w 0)
          echo "sas_url_b64=$SAS_URL_B64" >> $GITHUB_OUTPUT
          echo "Bundle SAS URL generated (expires in 2 hours)."

      # ── Get VMSS instance IDs ───────────────────────────────────────────────
      - name: Get VMSS instance IDs
        id: get-instances
        run: |
          IDS=$(az vmss list-instances \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_VMSS_NAME }}" \
            --query "[].instanceId" \
            --output tsv)
          echo "Instance IDs: $IDS"
          echo "instance_ids=$(echo $IDS | tr '\n' ' ')" >> $GITHUB_OUTPUT

      # ── Deploy to each instance: download bundle from blob, restart PM2 ────
      - name: Deploy to each VMSS instance
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SAS_URL_B64: ${{ steps.upload.outputs.sas_url_b64 }}
        run: |
          INSTANCE_IDS="${{ steps.get-instances.outputs.instance_ids }}"
          if [ -z "$INSTANCE_IDS" ]; then
            echo "ERROR: No VMSS instances found. Is the VMSS running?"
            exit 1
          fi

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "══════════════════════════════════════════"
            echo "Deploying to instance $INSTANCE_ID..."
            echo "══════════════════════════════════════════"

            az vmss run-command invoke \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_VMSS_NAME }}" \
              --command-id RunShellScript \
              --instance-id "$INSTANCE_ID" \
              --parameters \
                "ADMIN_PASSWORD=$ADMIN_PASSWORD" \
                "ADMIN_SECRET=$ADMIN_SECRET" \
                "SAS_URL_B64=$SAS_URL_B64" \
              --scripts '
                set -e

                # Extract parameters ($1=ADMIN_PASSWORD=..., $2=ADMIN_SECRET=..., $3=SAS_URL_B64=...)
                ADMIN_PASSWORD="${1#ADMIN_PASSWORD=}"
                ADMIN_SECRET="${2#ADMIN_SECRET=}"
                SAS_URL_B64="${3#SAS_URL_B64=}"

                # Decode the SAS URL (was base64-encoded to safely pass special chars)
                SAS_URL=$(echo "$SAS_URL_B64" | base64 -d)

                echo "--- Downloading pre-built bundle from Azure Blob Storage ---"
                curl -sL --fail -o /tmp/bundle.tar.gz "$SAS_URL"
                echo "Download complete: $(du -sh /tmp/bundle.tar.gz | cut -f1)"

                echo "--- Extracting bundle ---"
                mkdir -p /opt/amanat_ads_run/.next
                tar -xzf /tmp/bundle.tar.gz -C /opt/amanat_ads_run
                rm -f /tmp/bundle.tar.gz
                echo "Extraction complete."

                echo "--- Restarting PM2 with updated app ---"
                pm2 delete amanat-ads 2>/dev/null || true
                PORT=3000 \
                  ADMIN_PASSWORD="$ADMIN_PASSWORD" \
                  ADMIN_SECRET="$ADMIN_SECRET" \
                  NODE_ENV=production \
                  pm2 start /opt/amanat_ads_run/server.js --name amanat-ads
                pm2 save

                echo "--- Reloading NGINX ---"
                nginx -t && systemctl reload nginx

                echo "--- Status ---"
                pm2 status amanat-ads
                echo "Instance deploy complete!"
              '

            echo "Instance $INSTANCE_ID: done ✓"
          done

      # ── Clean up old blobs to avoid storage costs ───────────────────────────
      - name: Clean up old deployment blobs
        if: always()
        run: |
          SA=$(az storage account list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[0].name" --output tsv 2>/dev/null || true)
          if [ -z "$SA" ]; then exit 0; fi
          KEY=$(az storage account keys list \
            --account-name "$SA" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[0].value" --output tsv)
          # Delete blobs older than 4 hours
          CUTOFF=$(date -u -d "-4 hours" "+%Y-%m-%dT%H:%MZ")
          az storage blob delete-batch \
            --account-name "$SA" \
            --account-key "$KEY" \
            --source "${{ env.STORAGE_CONTAINER }}" \
            --if-unmodified-since "$CUTOFF" \
            --output none 2>/dev/null || true

      - name: Wait for app to stabilize
        run: sleep 15

      - name: Health check — verify /ms39 is live
        run: |
          LB_IP=$(az network public-ip show \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "pip-amanat-ads" \
            --query ipAddress --output tsv)
          echo "Load Balancer IP: $LB_IP"

          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$LB_IP/ms39")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Deployment successful — /ms39 is live at http://$LB_IP/ms39"
              exit 0
            fi
            sleep 10
          done

          echo "ERROR: /ms39 did not return 200. Check PM2 logs on the VM."
          exit 1

      - name: Azure logout
        if: always()
        run: az logout
