name: Deploy to Azure VMSS

# Runs on every push to main. Does NOT affect the AmanatEye App Service (Canada Central).
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AZURE_RESOURCE_GROUP: 'rg-amanat-ads'
  AZURE_VMSS_NAME: 'vmss-amanat-ads'
  APP_DIR: '/opt/amanat_ads'
  APP_RUN_DIR: '/opt/amanat_ads_run'

jobs:
  # ── JOB 1: Build & Verify ────────────────────────────────────────────────────
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production bundle (standalone)
        run: npm run build

      - name: Verify route files exist
        run: |
          test -f src/app/ms39/page.tsx         && echo "✓ /ms39 route found"
          test -f src/app/adminforms39/page.tsx  && echo "✓ /adminforms39 route found"
          test -d .next/standalone               && echo "✓ Standalone output found"
          echo "Build verification passed."

  # ── JOB 2: Deploy to VMSS ────────────────────────────────────────────────────
  # Loops over every instance — fixes the invalid --instance-id "*" syntax.
  deploy:
    name: Deploy to VMSS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          # Create AZURE_CREDENTIALS with:
          #   az ad sp create-for-rbac \
          #     --name "github-amanat-ads" \
          #     --role Contributor \
          #     --scopes /subscriptions/<ID>/resourceGroups/rg-amanat-ads \
          #     --sdk-auth
          # Paste the full JSON as the AZURE_CREDENTIALS secret in GitHub.

      - name: Get list of all VMSS instance IDs
        id: get-instances
        run: |
          IDS=$(az vmss list-instances \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_VMSS_NAME }}" \
            --query "[].instanceId" \
            --output tsv)
          echo "Instance IDs found: $IDS"
          # Serialize as space-separated string for the next step
          echo "instance_ids=$(echo $IDS | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Deploy to each VMSS instance
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          INSTANCE_IDS="${{ steps.get-instances.outputs.instance_ids }}"
          if [ -z "$INSTANCE_IDS" ]; then
            echo "ERROR: No VMSS instances found. Is the VMSS running?"
            exit 1
          fi

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "──────────────────────────────────────────"
            echo "Deploying to instance $INSTANCE_ID..."
            echo "──────────────────────────────────────────"
            az vmss run-command invoke \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_VMSS_NAME }}" \
              --command-id RunShellScript \
              --instance-id "$INSTANCE_ID" \
              --parameters "ADMIN_PASSWORD=$ADMIN_PASSWORD" "ADMIN_SECRET=$ADMIN_SECRET" \
              --scripts "
                set -e
                # Read secrets passed as parameters (positional: \$1 and \$2)
                export ADMIN_PASSWORD=\"\${1#ADMIN_PASSWORD=}\"
                export ADMIN_SECRET=\"\${2#ADMIN_SECRET=}\"

                echo '--- Pulling latest code ---'
                cd ${{ env.APP_DIR }}
                git pull origin main

                echo '--- Installing dependencies ---'
                npm ci

                echo '--- Building Next.js standalone ---'
                npm run build

                echo '--- Copying standalone bundle ---'
                mkdir -p ${{ env.APP_RUN_DIR }}/.next
                cp -r .next/standalone/. ${{ env.APP_RUN_DIR }}/
                cp -r .next/static       ${{ env.APP_RUN_DIR }}/.next/static
                cp -r public             ${{ env.APP_RUN_DIR }}/public

                echo '--- Restarting PM2 with secrets ---'
                env PORT=3000 \
                    ADMIN_PASSWORD=\"\$ADMIN_PASSWORD\" \
                    ADMIN_SECRET=\"\$ADMIN_SECRET\" \
                    NODE_ENV=production \
                    pm2 restart amanat-ads 2>/dev/null || \
                env PORT=3000 ADMIN_PASSWORD=\"\$ADMIN_PASSWORD\" ADMIN_SECRET=\"\$ADMIN_SECRET\" NODE_ENV=production \
                    pm2 start ${{ env.APP_RUN_DIR }}/server.js --name amanat-ads
                pm2 save

                echo '--- Reloading NGINX ---'
                nginx -t && systemctl reload nginx

                echo '--- Instance $INSTANCE_ID deploy complete ---'
                pm2 status amanat-ads
              "
            echo "Instance $INSTANCE_ID: done ✓"
          done

      - name: Wait for app to stabilize
        run: sleep 20

      - name: Health check — verify /ms39 is live
        run: |
          LB_IP=$(az network public-ip show \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "pip-amanat-ads" \
            --query ipAddress \
            --output tsv)
          echo "Load Balancer IP: $LB_IP"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$LB_IP/ms39")
          echo "HTTP status for /ms39: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: /ms39 returned HTTP $STATUS. Check PM2 logs on the VM."
            exit 1
          fi
          echo "✓ Deployment successful — /ms39 is live at http://$LB_IP/ms39"

      - name: Azure logout
        if: always()
        run: az logout
